<div class="field">
  <label [for]="inputId()" [class.sr-only]="hideLabel()">{{ label() }}</label>
  <ui-input
    [inputId]="inputId()"
    [type]="type()"
    [placeholder]="placeholder()"
    [autocomplete]="autocomplete()"
    [invalid]="invalido"
    [formControl]="control()"
  ></ui-input>
  <p class="field-error" *ngIf="invalido && errorMessage()">{{ errorMessage() }}</p>
</div>
