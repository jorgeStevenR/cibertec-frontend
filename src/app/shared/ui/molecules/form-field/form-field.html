<div class="field">
  <label [for]="inputId()" [class.sr-only]="hideLabel()">{{ label() }}<span class="requerido" *ngIf="requerido()" aria-hidden="true"> *</span><span class="sr-only" *ngIf="requerido()"> (obligatorio)</span></label>
  <div class="field-input-wrapper">
    <ui-input
      [inputId]="inputId()"
      [nombre]="nombre()"
      [type]="type()"
      [placeholder]="placeholder()"
      [autocomplete]="autocomplete()"
      [invalid]="invalido"
      [conBoton]="conBoton()"
      [formControl]="control()"
    ></ui-input>
    <ng-content select="[accion]"></ng-content>
  </div>
  <p class="field-error" *ngIf="invalido && errorMessage()">{{ errorMessage() }}</p>
</div>
