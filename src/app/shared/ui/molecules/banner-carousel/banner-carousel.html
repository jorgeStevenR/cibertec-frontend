<div class="carousel">
  <div class="slide" *ngFor="let slide of slides(); let i = index" [class.active]="i === activo()">
    <ng-container *ngIf="slide.imagen">
      <img class="slide-img" [src]="slide.imagen" [alt]="slide.alt || ''" [attr.loading]="i === 0 ? null : 'lazy'" />
      <div class="slide-overlay"></div>
    </ng-container>

    <div class="slide-text">
      <h2>
        <ng-container *ngFor="let parte of slide.titulo">
          <br *ngIf="parte.salto" />
          <span class="accent" *ngIf="!parte.salto && parte.resaltado">{{ parte.texto }}</span>
          <ng-container *ngIf="!parte.salto && !parte.resaltado">{{ parte.texto }}</ng-container>
        </ng-container>
      </h2>
      <p>{{ slide.subtitulo }}</p>
    </div>

    <svg class="slide-art" viewBox="0 0 200 140" aria-hidden="true" *ngIf="slide.icono === 'graduacion'">
      <circle cx="165" cy="30" r="26" fill="rgba(255,255,255,0.10)" />
      <circle cx="40" cy="110" r="18" fill="rgba(255,255,255,0.08)" />
      <g transform="translate(95,50)" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 10 40 -6 80 10 40 26Z" />
        <path d="M15 17v20c0 6 12 11 25 11s25-5 25-11V17" />
        <path d="M80 10v22" />
      </g>
    </svg>

    <svg class="slide-art" viewBox="0 0 200 140" aria-hidden="true" *ngIf="slide.icono === 'libro'">
      <circle cx="160" cy="100" r="22" fill="rgba(255,255,255,0.08)" />
      <circle cx="45" cy="25" r="15" fill="rgba(255,255,255,0.10)" />
      <g transform="translate(90,45)" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M40 6C33 2 20 0 8 2v42c12-2 25 0 32 4" />
        <path d="M40 6c7-4 20-6 32-4v42c-12-2-25 0-32 4" />
        <path d="M40 6v46" />
      </g>
    </svg>

    <svg class="slide-art" viewBox="0 0 200 140" aria-hidden="true" *ngIf="slide.icono === 'cohete'">
      <circle cx="150" cy="25" r="16" fill="rgba(255,255,255,0.10)" />
      <circle cx="50" cy="105" r="22" fill="rgba(255,255,255,0.08)" />
      <g transform="translate(95,30)" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 55c-10-18-10-38 5-52 15 14 15 34 5 52" />
        <circle cx="25" cy="20" r="6" />
        <path d="M14 46 4 56M36 46l10 10" />
        <path d="M17 55l-3 12M33 55l3 12" />
      </g>
    </svg>
  </div>

  <div class="dots" *ngIf="slides().length > 1">
    <button
      *ngFor="let slide of slides(); let i = index"
      type="button"
      class="dot"
      [class.active]="i === activo()"
      (click)="irA(i)"
      [attr.aria-label]="'Ir a la diapositiva ' + (i + 1)"
    ></button>
  </div>
</div>
