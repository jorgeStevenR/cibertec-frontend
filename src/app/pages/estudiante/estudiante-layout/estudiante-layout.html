<div class="shell">
  <header class="cabecera">
    <div class="cabecera-fila cabecera-principal">
      <span class="cabecera-espacio" aria-hidden="true"></span>

      <p class="titulo-sitio">Plataforma educativa</p>

      <div class="user-menu">
        <button
          #disparador
          type="button"
          class="user-trigger"
          aria-haspopup="menu"
          [attr.aria-expanded]="menuAbierto()"
          (click)="menuAbierto.set(!menuAbierto())"
        >
          <span class="user-text">
            <span>{{ usuario?.nombre }}</span>
            <span>{{ usuario?.apellido }}</span>
          </span>
          <span class="avatar" aria-hidden="true">{{ iniciales }}</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="dropdown-backdrop" *ngIf="menuAbierto()" (click)="cerrarMenu()"></div>

        <div class="user-dropdown" *ngIf="menuAbierto()" role="menu">
          <div class="dropdown-identidad">
            <span class="dropdown-rol">Estudiante</span>
            <span class="dropdown-email">{{ usuario?.email }}</span>
          </div>

          <a role="menuitem" routerLink="/estudiante" (click)="cerrarMenu()">Mis cursos</a>
          <a role="menuitem" routerLink="/estudiante/calificaciones" (click)="cerrarMenu()">Calificaciones</a>
          <a role="menuitem" routerLink="/estudiante" fragment="calendario" (click)="cerrarMenu()">Calendario</a>

          <div class="dropdown-sep" role="separator"></div>

          <a role="menuitem" [href]="'mailto:' + correoSoporte" (click)="cerrarMenu()">Soporte técnico</a>

          <div class="dropdown-sep" role="separator"></div>

          <button type="button" role="menuitem" (click)="cerrarSesion()">Cerrar sesión</button>
        </div>
      </div>
    </div>

    <div class="cabecera-fila">
      <nav class="nav" aria-label="Principal">
        <a routerLink="/estudiante" [class.active]="!enCalificaciones">Mis cursos</a>
        <a routerLink="/estudiante/calificaciones" routerLinkActive="active">Calificaciones</a>
      </nav>
    </div>
  </header>

  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <app-footer></app-footer>
</div>
