<div class="page-header">
  <div>
    <h1>Usuarios</h1>
    <p class="subtitle" *ngIf="puedeGestionar()">Administra las cuentas de docentes y estudiantes.</p>
    <p class="subtitle" *ngIf="!puedeGestionar()">Consulta las cuentas de administradores, docentes y estudiantes.</p>
  </div>
  <ui-button *ngIf="puedeGestionar()" [fullWidth]="false" [routerLink]="[detalleBase(), 'nuevo']">Nuevo usuario</ui-button>
</div>

<ui-alert [message]="error()"></ui-alert>

<div class="search-row">
  <input
    type="text"
    class="search-input"
    placeholder="Buscar por nombre, apellido o correo…"
    (input)="onBusquedaInput($any($event.target).value)"
  />
</div>

<data-table
  [columns]="columnas"
  [rows]="usuarios()"
  [loading]="cargando()"
  [emptyMessage]="busqueda() ? 'No hay usuarios que coincidan con la búsqueda.' : 'Todavía no hay usuarios registrados.'"
>
  <ng-template dataTableCell="usuario" let-usuario>
    <div class="usuario-identidad">
      <span class="avatar">{{ iniciales(usuario) }}</span>
      <div class="usuario-texto">
        <span class="usuario-nombre">{{ usuario.nombre }} {{ usuario.apellido }}</span>
        <span class="usuario-correo">{{ usuario.email }}</span>
      </div>
    </div>
  </ng-template>

  <ng-template #actions let-usuario>
    <ui-button variant="secondary" [fullWidth]="false" [routerLink]="[detalleBase(), usuario.id]">
      {{ puedeGestionar() ? 'Editar' : 'Ver' }}
    </ui-button>
  </ng-template>
</data-table>

<ui-pagination
  [pagina]="pagina()"
  [totalPaginas]="totalPaginas()"
  [totalElementos]="totalElementos()"
  (cambiarPagina)="cambiarPagina($event)"
></ui-pagination>
