<page-header
  titulo="Cursos"
  subtitulo="Crea cursos, asígnalos a un profesor y a un programa, y gestiona sus módulos y matrículas."
>
  <ui-button [fullWidth]="false" [routerLink]="['/admin', 'cursos', 'nuevo']">Nuevo curso</ui-button>
</page-header>

<ui-alert [message]="error()"></ui-alert>

<div class="filtros-row">
  <select-field
    label="Filtrar por profesor"
    inputId="filtro-profesor"
    [control]="filtroProfesor"
    [options]="opcionesProfesorFiltro"
    [hideLabel]="true"
  ></select-field>

  <select-field
    label="Filtrar por programa"
    inputId="filtro-programa"
    [control]="filtroPrograma"
    [options]="opcionesProgramaFiltro"
    [hideLabel]="true"
  ></select-field>
</div>

<data-table
  [columns]="columnas"
  [rows]="cursos()"
  [loading]="cargando()"
  [emptyMessage]="hayFiltros ? 'No hay cursos que coincidan con los filtros.' : 'Todavía no hay cursos creados.'"
>
  <ng-template dataTableCell="titulo" let-curso>
    <div class="curso-celda">
      <span class="curso-codigo">{{ curso.codigo ?? 'Sin código' }}</span>
      <a class="curso-titulo" [routerLink]="['/admin', 'cursos', curso.id]">{{ curso.titulo }}</a>
      <span class="curso-programa">{{ curso.programaNombre ?? 'Sin programa asignado' }}</span>
    </div>
  </ng-template>

  <ng-template dataTableCell="fechas" let-curso>
    <div class="fechas-celda" *ngIf="curso.fechaInicio || curso.fechaFin; else sinFechas">
      <span><small>Desde</small> {{ formatearFechaCalendario(curso.fechaInicio) }}</span>
      <span><small>Hasta</small> {{ formatearFechaCalendario(curso.fechaFin) }}</span>
    </div>
    <ng-template #sinFechas>—</ng-template>
  </ng-template>

  <ng-template dataTableCell="cupo" let-curso>
    <cupo-estado [matriculados]="curso.matriculados" [cupoMaximo]="curso.cupoMaximo"></cupo-estado>
  </ng-template>

  <ng-template #actions let-curso>
    <ui-button variant="secondary" [fullWidth]="false" [routerLink]="['/admin', 'cursos', curso.id, 'editar']">
      Editar
    </ui-button>
    <ui-button variant="danger" [fullWidth]="false" (pressed)="pedirEliminar(curso)">Eliminar</ui-button>
  </ng-template>
</data-table>

<ui-pagination
  [pagina]="pagina()"
  [totalPaginas]="totalPaginas()"
  [totalElementos]="totalElementos()"
  (cambiarPagina)="cambiarPagina($event)"
></ui-pagination>

<confirm-dialog
  [open]="confirmEliminarAbierto()"
  title="Eliminar curso"
  [message]="'¿Seguro que quieres eliminar «' + (cursoAEliminar()?.titulo ?? '') + '»? Esta acción no se puede deshacer.'"
  confirmLabel="Eliminar"
  [loading]="eliminando()"
  (confirmed)="confirmarEliminar()"
  (cancelled)="confirmEliminarAbierto.set(false)"
></confirm-dialog>
