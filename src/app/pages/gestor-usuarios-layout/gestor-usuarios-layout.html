<div class="shell">
  <header class="topbar">
    <img class="brand" src="/logo-ciberctec.png" alt="Ciberctec" />

    <div class="topbar-right">
      <div class="user-info" *ngIf="usuario as u">
        <span class="avatar">{{ iniciales(u) }}</span>
        <div class="user-texto">
          <span class="user-name">{{ u.nombre }} {{ u.apellido }}</span>
          <span class="user-email">{{ u.email }}</span>
        </div>
      </div>
      <button type="button" class="logout-btn" (click)="cerrarSesion()">Cerrar sesión</button>
    </div>
  </header>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
