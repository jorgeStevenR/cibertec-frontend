<welcome-banner
  [nombre]="usuario?.nombre ?? ''"
  subtitulo="Estos son los cursos que tienes asignados como profesor."
></welcome-banner>

<banner-carousel></banner-carousel>

<ui-alert [message]="error()"></ui-alert>

<div class="cursos-grid" *ngIf="cargando()">
  <curso-card-skeleton *ngFor="let _ of esqueletos"></curso-card-skeleton>
</div>

<p *ngIf="!cargando() && cursos().length === 0" class="state-msg">
  Todavía no tienes cursos asignados.
</p>

<div class="cursos-grid" *ngIf="!cargando() && cursos().length > 0">
  <curso-card
    *ngFor="let curso of cursosPagina()"
    [codigo]="curso.codigo ?? ''"
    [titulo]="curso.titulo"
    [publicado]="curso.publicado"
    [periodo]="curso.periodo"
    [fechaInicio]="curso.fechaInicio"
    [fechaFin]="curso.fechaFin"
    [matriculados]="curso.matriculados"
    [cupoMaximo]="curso.cupoMaximo"
    [meta]="[
      curso.totalModulos + ' ' + (curso.totalModulos === 1 ? 'módulo' : 'módulos'),
      'Creado el ' + formatearFecha(curso.fechaCreacion)
    ]"
    [routerLinkTarget]="['/profesor', 'cursos', curso.id]"
    (participantesClick)="abrirParticipantes(curso)"
  ></curso-card>
</div>

<ui-pagination
  *ngIf="!cargando() && cursos().length > 0"
  [pagina]="pagina()"
  [totalPaginas]="totalPaginas()"
  [totalElementos]="cursos().length"
  (cambiarPagina)="cambiarPagina($event)"
></ui-pagination>
