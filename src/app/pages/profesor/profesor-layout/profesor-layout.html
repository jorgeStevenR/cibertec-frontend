<div class="shell">
  <header class="cabecera">
    <div class="topbar">
      <span class="topbar-espacio" aria-hidden="true"></span>

      <a class="titulo-sitio" routerLink="/profesor">Plataforma educativa</a>

      <div class="topbar-right">
        <button type="button" class="icon-btn" aria-label="Notificaciones" title="Notificaciones">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M12 3a6 6 0 0 0-6 6v3.5L4 16h16l-2-3.5V9a6 6 0 0 0-6-6Z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
            <path d="M9.5 19a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>

        <div class="user-menu">
          <button type="button" class="user-trigger" (click)="menuAbierto.set(!menuAbierto())">
            <span class="avatar">{{ iniciales }}</span>
            <span class="user-text">
              <span class="user-name">{{ usuario?.nombre }} {{ usuario?.apellido }}</span>
              <span class="user-rol">Profesor</span>
            </span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none">
              <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <div class="dropdown-backdrop" *ngIf="menuAbierto()" (click)="menuAbierto.set(false)"></div>

          <div class="user-dropdown" *ngIf="menuAbierto()">
            <div class="dropdown-email">{{ usuario?.email }}</div>
            <a routerLink="/profesor/perfil" (click)="menuAbierto.set(false)">Mi perfil</a>
            <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </div>

    <nav class="tabs">
      <a routerLink="/profesor" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Área personal
      </a>
      <a routerLink="/profesor/cursos" routerLinkActive="active">Cursos</a>
    </nav>
  </header>

  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <app-footer></app-footer>
</div>
